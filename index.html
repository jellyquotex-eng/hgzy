<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f4ec">
<title>For you</title>
<style>
:root{--ow:#f8f4ec;--bb:#bcdaee;--ol:#8c9461;--ink:#464c34}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ow);-webkit-text-size-adjust:100%}
.sky{position:fixed;inset:0;opacity:0;transition:opacity 5.5s ease-in-out}
.sky.on{opacity:1}
#sa{background:radial-gradient(120% 90% at 15% 6%,#d7eaf7 0%,transparent 62%),radial-gradient(100% 80% at 90% 95%,#e8ecd6 0%,transparent 60%),linear-gradient(#f8f4ec,#eef4f5)}
#sb{background:radial-gradient(90% 70% at 50% 35%,#dcecf7 0%,transparent 65%),radial-gradient(90% 70% at 10% 95%,#e6ebd3 0%,transparent 60%),linear-gradient(#faf7f0,#f4f4ec)}
#sc{background:radial-gradient(90% 70% at 85% 8%,#e1e7cb 0%,transparent 60%),radial-gradient(100% 80% at 12% 85%,#cde2f0 0%,transparent 62%),radial-gradient(70% 60% at 60% 60%,#f6f3e8 0%,transparent 70%),linear-gradient(#f7f5ec,#f1f3ea)}
#glow{position:fixed;left:50%;top:50%;width:min(130vw,900px);height:min(110vw,760px);margin:calc(min(110vw,760px)/-2) 0 0 calc(min(130vw,900px)/-2);border-radius:50%;background:radial-gradient(closest-side,rgba(188,218,238,.8),rgba(188,218,238,.26) 55%,transparent);opacity:0;transition:opacity 4.5s ease-in-out;pointer-events:none;z-index:1}
#glow.on{opacity:1}
#glow i{display:block;width:100%;height:100%;border-radius:50%;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:2;display:block}
#veil{position:fixed;inset:0;background:var(--ow);z-index:5;pointer-events:none;animation:veil 3.5s cubic-bezier(.4,0,.2,1) .3s forwards}
@keyframes veil{to{opacity:0}}
#stage{position:fixed;inset:0;z-index:3;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));pointer-events:none}
.scene{grid-area:1/1;text-align:center;max-width:24em;font-family:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;font-size:clamp(1.3rem,4.9vw,2.2rem);line-height:1.72;color:var(--ink);font-weight:500;text-shadow:0 0 18px rgba(248,244,236,1),0 0 5px rgba(248,244,236,.9)}
.scene.s2{text-shadow:0 0 22px rgba(215,234,247,1),0 0 6px rgba(248,244,236,.95)}
.line{display:block;margin:0;min-height:1.72em;opacity:0;transform:translateY(16px);filter:blur(7px);transition:opacity 2.6s cubic-bezier(.22,1,.36,1),transform 3s cubic-bezier(.22,1,.36,1),filter 2.4s ease}
.line.in{opacity:1;transform:none;filter:none}
.line.gap{margin-top:1.1em}
.scene.out .line{opacity:0;transform:translateY(-12px);filter:blur(6px);transition:opacity 2.3s ease-in,transform 2.6s ease-in,filter 2.3s ease-in}
.emo{display:inline-block;font-style:normal}
.beat{animation:beat 3.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){
 .line,.scene.out .line{transform:none!important;filter:none!important;transition:opacity 1.6s ease!important}
 #glow i,.beat{animation:none}
 .sky,#glow{transition-duration:3s}
}
</style>
</head>
<body>
<div class="sky" id="sa"></div><div class="sky" id="sb"></div><div class="sky" id="sc"></div>
<div id="glow"><i></i></div>
<canvas id="c" aria-hidden="true"></canvas>
<main id="stage">
 <section class="scene s0" id="s0">
  <p class="line">ekta kotha ki jano?</p>
  <p class="line gap" data-t="ummm........!"></p>
 </section>
 <section class="scene s1" id="s1">
  <p class="line">Tmr moto keu chilo nahh.</p>
  <p class="line">Tmr moto keu nai,</p>
  <p class="line">tmr moto keu ashbe na,</p>
  <p class="line">you're always special for me :) <span class="emo">🥺</span></p>
 </section>
 <section class="scene s2" id="s2">
  <p class="line">keno jano?</p>
  <p class="line gap">karon tmi amar moner moto, hahah <span class="emo">❤️</span></p>
 </section>
 <section class="scene s3" id="s3">
  <p class="line">Ajke ar kono yes/no er jonno chap dibo na.</p>
  <p class="line gap">Je moner virodde theke yes/no answer deba,</p>
  <p class="line">setai amar kache enough, hahahah. <span class="emo" id="fin">❤️</span></p>
 </section>
</main>
<div id="veil"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('c'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),sm=t=>t*t*(3-2*t);
const sr=s=>()=>(s=s*16807%2147483647)/2147483647;
let W,H,DPR,K,L0,BX,BY,fall=[],dust=[],orbs=[],tree=[],leaves=[],name=[],bursts=[],sparks=[],pops=[],hx,hy,sc,NY;
const HEART0=12.5,HEART_D=4.5,MORPH0=19.5,MORPH_D=3,NAME_END=28.5,DISS_D=3;   // love-art timings (seconds)
const hp=(t,k)=>[hx+k*16*Math.pow(Math.sin(t),3),hy-k*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))];
const S={swirl:0,tree:1,speed:reduce?.35:1},M={swirl:0,tree:1},P={x:0,y:0,tx:0,ty:0};

const HEART=new Path2D();HEART.moveTo(0,.35);HEART.bezierCurveTo(-1,-.25,-.5,-1,0,-.45);HEART.bezierCurveTo(.5,-1,1,-.25,0,.35);HEART.closePath();
function sprite(rgb){const s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,`rgba(${rgb},1)`);r.addColorStop(.35,`rgba(${rgb},.35)`);r.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=r;g.fillRect(0,0,64,64);return s}
const SP={blue:sprite('150,200,230'),olive:sprite('170,178,120'),warm:sprite('255,250,236')};
const BCOL=['#6b7348','#767e50','#818a58','#8c9461','#98a169','#a3ab74','#aeb67f'];
const LCOL=['#a3ab74','#8c9461','#bcdaee','#9dc6e0','#fffcf4','#b7c08a'];
const FCOL=['#bcdaee','#d6e9f5','#fffcf4','#cfd9a8','#a3ab74','#9dc6e0'];

function makeTree(){
 const R=sr(11);tree=[];leaves=[];L0=Math.min(H*.17,W*.3);BX=W/2;BY=H*.94;
 const lf=(x,y,t)=>({x,y,t:t+R()*.7,s:(6+R()*6)*K,c:LCOL[(R()*6)|0],r:(R()-.5)*1.3,ph:R()*6.28});
 const gen=(x,y,a,len,w,d,t0)=>{
  const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len,bd=(R()-.5)*len*.3;
  const cx=(x+x2)/2-Math.sin(a)*bd,cy=(y+y2)/2+Math.cos(a)*bd,dur=.5+len/L0*.9,t1=t0+dur;
  tree.push({x,y,cx,cy,x2,y2,w,t0,dur,c:BCOL[d]});
  if(d>=4)leaves.push(lf(x2,y2,t1));
  if(d===6&&R()<.5)leaves.push(lf(cx,cy,t1-.2));
  if(d<6){const n=d===0?3:2;for(let i=0;i<n;i++){
   const off=n===3?(i-1)*.5:(i?1:-1)*(.25+R()*.3);
   gen(x2,y2,a+off+(R()-.5)*.15,len*(.76+R()*.06),Math.max(1.2,w*.72),d+1,t1)}}
 };
 gen(BX,BY,-Math.PI/2,L0,Math.max(5,L0*.09),0,0);
}
function makeArt(a){
 hx=W/2;hy=H*.43;NY=hy;sc=clamp(Math.min(W,H*.62)*.0148,4,11);
 const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');
 const f='italic 600 100px "Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
 g.font=f;const w=g.measureText('Waisuuu').width,fs=Math.min(100*Math.min(W*.82,880)/w,H*.2);
 g.font=f.replace('100px',fs+'px');g.textAlign='center';g.textBaseline='middle';g.fillStyle='#000';g.fillText('Waisuuu',W/2,NY);
 const y0=Math.max(0,Math.floor(NY-fs)),h=Math.min(H-y0,Math.ceil(fs*2)),d=g.getImageData(0,y0,W,h).data,st=Math.max(3,Math.round(fs/19)),pts=[];
 for(let y=0;y<h;y+=st)for(let x=0;x<W;x+=st)if(d[(y*W+x)*4+3]>128)pts.push([x,y0+y]);
 const keep=Math.min(1,900/pts.length),NC=['#8c9461','#7fb2d4','#a3ab74','#9dc6e0'];
 name=pts.filter(()=>Math.random()<keep).map(([x,y])=>{const[sx,sy]=hp(rnd(0,6.2832),sc*rnd(.6,1));
  return{sx,sy,tx:x,ty:y,d:rnd(0,1.2),arc:rnd(20,70)*(Math.random()<.5?-1:1),r:(1.3+Math.random()*1.3)*K*clamp(st/5,.8,1.6),c:NC[(Math.random()*4)|0],ph:rnd(0,6.28),sp:rnd(1,2.4),h:Math.random()<.14}});
 bursts=Array.from({length:Math.round(34*Math.max(.7,a))},()=>({a:rnd(0,6.283),sp:rnd(90,260)*K,s:rnd(5,11)*K,c:['#a3ab74','#8c9461','#bcdaee','#9dc6e0'][(Math.random()*4)|0],rise:rnd(10,40)}));
 sparks=Array.from({length:Math.round(20*a)},()=>({x:rnd(0,W),y:rnd(0,H*.8),s:rnd(3,8)*K,ph:rnd(0,6.28),sp:rnd(.8,2)}));
}
function build(){
 DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 K=clamp(W/520,.85,1.5);
 const a=clamp(Math.sqrt(W*H/(390*844)),.75,1.7)*(reduce?.5:1);
 fall=Array.from({length:Math.round(24*a)},()=>({x:rnd(0,W),y:rnd(-H*.2,H),z:rnd(.3,1),ph:rnd(0,6.28),rot:rnd(0,6.28),vr:rnd(-.6,.6),fl:rnd(.5,1.4),h:Math.random()<.45,c:FCOL[(Math.random()*6)|0]}));
 dust=Array.from({length:Math.round(90*a)},()=>({x:rnd(0,W),y:rnd(0,H),z:rnd(.3,1),ph:rnd(0,6.28),sp:rnd(.4,1.1),s:(Math.random()*3)|0}));
 orbs=[['blue',.2,.25,.38],['blue',.82,.2,.42],['olive',.75,.8,.3],['olive',.15,.78,.3],['warm',.5,.5,.4],['warm',.5,.12,.3]].map(o=>({s:SP[o[0]],x:o[1],y:o[2],r:o[3],ph:rnd(0,6.28)}));
 makeTree();makeArt(a);
}
function petal(s){
 ctx.beginPath();ctx.moveTo(0,-s*.7);
 ctx.bezierCurveTo(s*.35,-s*1.05,s*.95,-s*.45,s*.6,s*.3);ctx.quadraticCurveTo(s*.25,s*.85,0,s);
 ctx.quadraticCurveTo(-s*.25,s*.85,-s*.6,s*.3);ctx.bezierCurveTo(-s*.95,-s*.45,-s*.35,-s*1.05,0,-s*.7);ctx.closePath();
}
function wave(t,i,col){
 const base=H*(.88+.03*i),amp=H*(.016+.004*i);
 ctx.beginPath();ctx.moveTo(0,H);
 for(let x=0;x<=W+14;x+=14)ctx.lineTo(x,base+Math.sin(x*.0055/K*1.3+t*.00035*(1+i*.35)+i*2)*amp+Math.sin(x*.012-t*.0003+i)*amp*.45);
 ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=col;ctx.fill();
}
function drawTree(ts,ease){
 const tt=reduce?99:ts-1.8,a=M.tree*ease;
 // seed of light before the tree grows
 if(ts<3.4){const g=sm(clamp(ts/1.2,0,1))*(1-sm(clamp((ts-1.8)/1.5,0,1))),r=(24+5*Math.sin(ts*4))*K;
  ctx.globalAlpha=g*.9;ctx.drawImage(SP.warm,BX-r,BY-r-6,r*2,r*2);ctx.globalAlpha=g*.7;ctx.drawImage(SP.blue,BX-r*1.8,BY-r*1.8-6,r*3.6,r*3.6)}
 // ground glow
 ctx.save();ctx.translate(BX,BY+4);ctx.scale(1,.18);ctx.globalAlpha=.55*ease*M.tree*sm(clamp((ts-1)/2,0,1));
 const gr=L0*1.5;ctx.drawImage(SP.olive,-gr,-gr,gr*2,gr*2);ctx.restore();
 ctx.save();ctx.translate(BX,BY);ctx.rotate(Math.sin(ts*.45)*.004*sm(clamp(tt/8,0,1)));ctx.translate(-BX,-BY);
 ctx.globalAlpha=a;ctx.lineCap='round';
 for(const b of tree){
  const p=clamp((tt-b.t0)/b.dur,0,1);if(p<=0)continue;
  const q=1-p,ex=q*q*b.x+2*q*p*b.cx+p*p*b.x2,ey=q*q*b.y+2*q*p*b.cy+p*p*b.y2;
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.quadraticCurveTo(b.x+(b.cx-b.x)*p,b.y+(b.cy-b.y)*p,ex,ey);
  ctx.lineWidth=b.w;ctx.strokeStyle=b.c;ctx.stroke();
 }
 for(const l of leaves){
  const age=tt-l.t;if(age<=0)continue;
  const s=l.s*sm(clamp(age/1.8,0,1))*(1+.05*Math.sin(ts*1.2+l.ph));
  ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.r+Math.sin(ts*.8+l.ph)*.12);ctx.scale(s,s);
  ctx.fillStyle=l.c;ctx.fill(HEART);
  if(l.c==='#fffcf4'){ctx.lineWidth=.1;ctx.strokeStyle='rgba(140,148,97,.45)';ctx.stroke(HEART)}
  ctx.restore();
 }
 ctx.restore();
}

function star(x,y,s){ctx.beginPath();ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x,y,x+s,y);ctx.quadraticCurveTo(x,y,x,y+s);ctx.quadraticCurveTo(x,y,x-s,y);ctx.quadraticCurveTo(x,y,x,y-s);ctx.fill()}
function drawArt(ts){
 const th=ts-HEART0;if(th<0)return;
 const fade=1-sm(clamp((ts-MORPH0)/2.2,0,1));
 if(fade>0){
  const beat=1+.035*Math.sin(Math.max(0,th-HEART_D)*4.2);
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const[k,c,w,dl]of[[1,'#8c9461',2.4,0],[.8,'#9dc6e0',2,.7],[.58,'#a3ab74',1.6,1.3]]){
   const p=sm(clamp((th-dl)/HEART_D,0,1));if(p<=0)continue;
   const n=Math.ceil(120*p);ctx.beginPath();let lx,ly;
   for(let i=0;i<=n;i++){[lx,ly]=hp(i/120*6.2832,sc*k*beat);i?ctx.lineTo(lx,ly):ctx.moveTo(lx,ly)}
   ctx.globalAlpha=fade;ctx.lineWidth=w*K;ctx.strokeStyle=c;ctx.stroke();
   if(p<1){const r=22*K;ctx.globalAlpha=fade*.9;ctx.drawImage(SP.warm,lx-r,ly-r,r*2,r*2);ctx.drawImage(SP.blue,lx-r,ly-r,r*2,r*2)}
  }
  const r=sc*24;ctx.globalAlpha=fade*sm(clamp((th-HEART_D)/1.5,0,1))*.55;ctx.drawImage(SP.blue,hx-r,hy-r*.9,r*2,r*2);
 }
 const age=th-HEART_D;
 if(age>0&&age<4)for(const b of bursts){
  const d=b.sp*(1-Math.exp(-age*1.3));
  ctx.save();ctx.translate(hx+Math.cos(b.a)*d,hy+Math.sin(b.a)*d-b.rise*age);ctx.scale(b.s,b.s);
  ctx.globalAlpha=Math.min(1,age*3)*(1-age/4)*.9;ctx.fillStyle=b.c;ctx.fill(HEART);ctx.restore();
 }
 for(const r0 of[HEART0+HEART_D,MORPH0+MORPH_D+1.2]){const a=ts-r0;if(a>0&&a<3.6){ctx.lineWidth=1.5;
  for(let k=0;k<2;k++){const b=a-k*.4;if(b<=0)continue;ctx.globalAlpha=(1-b/3.6)*.4;ctx.strokeStyle=k?'#8c9461':'#9dc6e0';ctx.beginPath();ctx.arc(hx,hy,b/3.6*Math.max(W,H)*.5,0,6.2832);ctx.stroke()}}}
 const tm=ts-MORPH0;
 if(tm>-1&&ts<NAME_END+DISS_D+1.5){
  const gl=sm(clamp((tm-1.5)/2,0,1))*(1-sm(clamp((ts-NAME_END)/DISS_D,0,1))),gw=W*.5;
  ctx.globalAlpha=.5*gl;ctx.drawImage(SP.blue,W/2-gw,NY-gw*.45,gw*2,gw*.9);
  for(const n of name){
   const p=sm(clamp((tm-n.d)/MORPH_D,0,1));if(p<=0)continue;
   const q=sm(clamp((ts-NAME_END-n.d*1.2)/DISS_D,0,1));if(q>=1)continue;
   let x=n.sx+(n.tx-n.sx)*p,y=n.sy+(n.ty-n.sy)*p-Math.sin(p*3.1416)*n.arc;
   if(p>=1){x+=Math.sin(ts*n.sp+n.ph)*1.3;y+=Math.cos(ts*n.sp+n.ph)*1.3}
   y-=q*(70+n.d*80);x+=Math.sin(n.ph)*q*50;
   const al=Math.min(1,p*3)*(1-q)*(.75+.25*Math.sin(ts*n.sp*2+n.ph));
   ctx.globalAlpha=al*.45;ctx.drawImage(SP.blue,x-n.r*2.5,y-n.r*2.5,n.r*5,n.r*5);
   ctx.globalAlpha=al;ctx.fillStyle=n.c;
   if(n.h){ctx.save();ctx.translate(x,y);ctx.scale(n.r*2.2,n.r*2.2);ctx.fill(HEART);ctx.restore()}
   else{ctx.beginPath();ctx.arc(x,y,n.r,0,6.2832);ctx.fill()}
  }
 }
 ctx.globalAlpha=1;
}
const T0=performance.now();let last=0,raf=0;
function frame(now){
 raf=requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-(last||now))/1000)*S.speed;last=now;
 const ts=(now-T0)/1000,appear=clamp(ts/4,0,1),ease=sm(appear);
 M.swirl+=(S.swirl-M.swirl)*dt*.4;M.tree+=(S.tree-M.tree)*dt*.6;
 P.x+=(P.tx-P.x)*.04;P.y+=(P.ty-P.y)*.04;
 ctx.clearRect(0,0,W,H);
 for(const o of orbs){
  const x=o.x*W+Math.sin(ts*.11+o.ph)*W*.06+P.x*30,y=o.y*H+Math.cos(ts*.09+o.ph*1.3)*H*.05+P.y*30,r=o.r*Math.max(W,H)*(1+.06*Math.sin(ts*.2+o.ph));
  ctx.globalAlpha=.55*ease;ctx.drawImage(o.s,x-r,y-r,r*2,r*2);
 }
 const tm=ts*1000*S.speed;
 ctx.globalAlpha=ease;wave(tm,0,'rgba(188,218,238,.26)');wave(tm,1,'rgba(248,244,236,.5)');wave(tm,2,'rgba(140,148,97,.14)');
 drawTree(ts,ease);drawArt(ts);
 for(const d of dust){
  d.y-=(5+d.z*9)*K*dt;d.x+=Math.sin(ts*d.sp+d.ph)*6*d.z*dt+3*dt;
  if(d.y<-8){d.y=H+8;d.x=rnd(0,W)}if(d.x>W+8)d.x=-8;
  const tw=.5+.5*Math.sin(ts*d.sp*1.6+d.ph),r=(4+d.z*9)*K*(.7+.5*tw);
  ctx.globalAlpha=(.25+.5*tw)*d.z*ease;
  ctx.drawImage(d.s===0?SP.warm:d.s===1?SP.blue:SP.olive,d.x+P.x*d.z*40-r,d.y+P.y*d.z*40-r,r*2,r*2);
 }
 const g=sm(clamp((ts-5)/6,0,1));            // blossoms and heart leaves drift once the tree is alive
 for(const p of fall){
  const s=(5.5+p.z*9)*K;
  p.y+=(15+p.z*24)*K*(1-.35*M.swirl)*dt;
  p.x+=(Math.sin(ts*.6+p.ph)*16*(1+M.swirl*1.2)+9+Math.cos(ts*.5+p.ph)*M.swirl*14)*p.z*dt;
  p.rot+=p.vr*dt;
  if(p.y>H+30){p.y=-30;p.x=rnd(-40,W)}if(p.x>W+40)p.x=-40;if(p.x<-60)p.x=W+30;
  ctx.save();ctx.translate(p.x+P.x*p.z*34,p.y+P.y*p.z*34);ctx.rotate(p.rot);
  ctx.scale(.3+.7*Math.abs(Math.cos(ts*p.fl+p.ph)),1);
  ctx.globalAlpha=(.4+p.z*.5)*g;ctx.fillStyle=p.c;
  if(p.h){ctx.scale(s*.9,s*.9);ctx.fill(HEART)}
  else{petal(s);ctx.fill();ctx.lineWidth=.7;ctx.strokeStyle='rgba(140,148,97,.3)';ctx.stroke()}
  ctx.restore();
 }
 for(let i=0;i<sparks.length;i++){const k=sparks[i],v=Math.max(0,Math.sin(ts*k.sp+k.ph));
  ctx.globalAlpha=v*v*v*.85*ease;ctx.fillStyle=i%2?'#9dc6e0':'#a3ab74';star(k.x+P.x*14,k.y+P.y*14,k.s*(.6+v*.6))}
 for(let i=pops.length-1;i>=0;i--){const o=pops[i],a=ts-o.t;if(a>1.8){pops.splice(i,1);continue}
  ctx.save();ctx.translate(o.x+o.vx*a,o.y+o.vy*a+60*a*a);ctx.rotate(o.r);ctx.scale(o.s,o.s);
  ctx.globalAlpha=(1-a/1.8)*.9;ctx.fillStyle=o.c;ctx.fill(HEART);ctx.restore()}
 ctx.globalAlpha=1;
}
function start(){if(!raf){last=0;raf=requestAnimationFrame(frame)}}
function stop(){cancelAnimationFrame(raf);raf=0}
addEventListener('resize',build);
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
addEventListener('pointermove',e=>{P.tx=(e.clientX/W-.5)*2;P.ty=(e.clientY/H-.5)*2},{passive:true});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;P.tx=clamp(e.gamma/30,-1,1);P.ty=clamp((e.beta-45)/30,-1,1)},{passive:true});
addEventListener('pointerdown',e=>{const t=(performance.now()-T0)/1000;for(let i=0;i<9;i++)pops.push({x:e.clientX,y:e.clientY,vx:rnd(-90,90),vy:rnd(-150,-40),r:rnd(-.5,.5),s:rnd(5,10)*K,c:['#a3ab74','#9dc6e0','#8c9461','#bcdaee'][i%4],t})},{passive:true});
build();start();

// ---------- timeline ----------
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const sky=id=>document.querySelectorAll('.sky').forEach(e=>e.classList.toggle('on',e.id===id));
const glow=on=>$('glow').classList.toggle('on',on);
const waitTo=s=>sleep(Math.max(0,s*1000-(performance.now()-T0)));
async function reveal(sc,gaps){const l=[...$(sc).querySelectorAll('.line')];for(let i=0;i<l.length;i++){const e=l[i];e.classList.add('in');
 if(e.dataset.t){e.textContent='';for(const ch of e.dataset.t){e.textContent+=ch;await sleep(ch==='.'?400:170)}}
 await sleep(gaps[Math.min(i,gaps.length-1)])}}
async function leave(sc){const e=$(sc);e.classList.add('out');await sleep(3000);e.style.display='none'}

(async()=>{
 sky('sa');                          // 1. text-free intro: a light seed, the love tree grows
 await waitTo(9);sky('sb');
 await waitTo(11.5);S.tree=0;        // 2. the tree gives way to the love art
 await waitTo(MORPH0);sky('sc');     // 3. the heart melts into her name
 await waitTo(NAME_END+DISS_D+1);sky('sb');S.tree=.5;
 await reveal('s0',[2800,3800]);     // 4. "ekta kotha ki jano?" ... "ummm........!"
 await sleep(2200);await leave('s0');await sleep(600);
 await reveal('s1',[2300,2300,2400,1200]);
 await sleep(4800);await leave('s1');
 await sleep(900);glow(true);
 await reveal('s2',[3600,1500]);
 await sleep(5200);await leave('s2');glow(false);
 await sleep(900);sky('sc');S.tree=.7;
 await sleep(2600);
 await reveal('s3',[3200,2200,1500]);
 await sleep(1500);                  // 9. closing: the tree glows, hearts swirl down
 S.tree=1;S.swirl=1;glow(true);$('fin').classList.add('beat');
})();
})();
</script>
